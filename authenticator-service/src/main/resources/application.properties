spring.mongodb.uri=mongodb:://admin:password@authdb-0.auth-mongo.authdb.svc.cluster.local:27017,authdb-1.auth-mongo.authdb.svc.cluster.local:27017,authdb-2.auth-mongo.authdb.svc.cluster.local:27017/authDB?authSource=admin&replicaSet=replicaSet
spring.application.name=authenticator-service
logging.level.org.springframework.security=TRACE
logging.level.org.springframework.data.mongodb.core.MongoTemplate=DEBUG