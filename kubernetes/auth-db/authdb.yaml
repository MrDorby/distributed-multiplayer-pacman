# Defines the namespace for the authdb
apiVersion: v1
kind: Namespace
metadata:
  name: authdb

---

# Defines the configuration for the authdb containers.
apiVersion: v1
kind: ConfigMap
metadata:
  name: authdb-config
  namespace: authdb
data:
  create_user.sh: |
    #!/bin/bash
    if [ "$HOSTNAME" == "authdb-0" ]; then
      mongosh admin --eval "rs.initiate({_id: 'replicaSet', members: [{ _id: 0, host: 'authdb-0.auth-mongo.authdb.svc.cluster.local:27017', priority: 2 }]})"
      sleep 5;

      mongosh admin --eval "db.getSiblingDB('admin').createUser({user: '$MONGO_INITDB_ROOT_USERNAME', pwd: '$MONGO_INITDB_ROOT_PASSWORD', roles: [{ role: 'root', db: 'admin' }]})"
      
      mongosh authdb-0.auth-mongo.authdb.svc.cluster.local:27017 -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "db.getSiblingDB('authDB').createCollection('auth');"
    else
      sleep 15;
      mongosh authdb-0.auth-mongo.authdb.svc.cluster.local:27017 -u "$MONGO_INITDB_ROOT_USERNAME" -p "$MONGO_INITDB_ROOT_PASSWORD" --authenticationDatabase admin --eval "rs.add({ host: '${HOSTNAME}.auth-mongo.authdb.svc.cluster.local:27017', priority: 1 })"
    fi;

---

# Defines the file containing the replica key.
apiVersion: v1
kind: ConfigMap
metadata:
  name: replica-key
  namespace: authdb
data:
  # Created with openssl rand base64 100
  replica.key: |
    EWP6gDQtL7VtkZBoeO9jmL2oYKihGKRvvl+sAZbrsOumv5KCe/VEmmsZ3olHdcFYIrA31VeirjToZw9ZPrx9OO4WHe9aVYw6q7q2X+sA9VyYRXbTcOYHYmi0l9UgO7v7IVDAmQ==

---

# Defines the username and password of root user.
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: authdb-secret
  namespace: authdb
data:
  # admin in Base64
  MONGO_INITDB_ROOT_USERNAME: YWRtaW4=
  # password in Base64
  MONGO_INITDB_ROOT_PASSWORD: cGFzc3dvcmQ=
  # ./replica.key in Base64
  # replica_key: 

---

# Headless service for MongoDB pods.
apiVersion: v1
kind: Service
metadata:
  name: auth-mongo
  namespace: authdb
  labels:
    app: auth-mongo
spec:
  ports:
    - port: 27017         # Incoming traffic at port 27017
      targetPort: 27017   # Redirect the incoming traffic to port 27017 on pods.
  clusterIP: None         # Headleass service.
  selector:
    app: auth-mongo

---

apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: authdb          # Pod name.
  namespace: authdb
spec:
  serviceName: auth-mongo   # Service name.
  replicas: 3
  selector:
    matchLabels:
      app: auth-mongo
  template:
    metadata:
      labels:
        app: auth-mongo
    spec:
      containers:
        - name: authdb
          image: mongo:latest
          command:
            - /bin/bash
            - -c
            - |
              /data/mongodbinit/create_user.sh &
              mongod --replSet=replicaSet --bind_ip_all --auth --keyFile=/key/replica.key;
          #command: ["mongod", "--replSet", "replicaSet", "--keyFile", "/key/replica.key", "--bind_ip_all"]
          #command: ["/home/mongodb/permission.sh", "docker-entrypoint.sh", "mongod", "--replSet", "replicaSet", "--keyFile", "/key/replica.key", "--bind_ip_all"]
          env:
            - name: REPLICA_KEY_DIR
              value: /key
            - name: MONGO_INITDB_ROOT_USERNAME
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: MONGO_INITDB_ROOT_USERNAME
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: authdb-secret
                  key: MONGO_INITDB_ROOT_PASSWORD
          ports:
            - containerPort: 27017
          volumeMounts:
            - name: mongo-auth      # PersistantVolumeClaim
              mountPath: /data/db
            - name: replicakey
              mountPath: /key
              readOnly: true
            - name: mongodb-init
              mountPath: /data/mongodbinit
            # - name: config
            #   mountPath: /docker-entrypoint-initdb.d
            # - name: permissions
            #   mountPath: /home/mongodb
      volumes:
        - name: replicakey
          configMap:
            name: replica-key
            defaultMode: 0600
          # secret:
          #   secretName: authdb-secret
          #   defaultMode: 0400
          #   items:
          #     - key: replica_key    # Field in secret.yaml
          #       path: replica.key
        # - name: permissions
        #   configMap:
        #     name: permissions
        #     defaultMode: 0755
        # - name: config
        #   configMap:
        #     name: authdb-config
        #     defaultMode: 0755
        - name: mongodb-init
          configMap:
            name: authdb-config
            defaultMode: 0777
  volumeClaimTemplates:             # Defines a PersistentVolumeClaim
    - metadata:
        name: mongo-auth
      spec:
        accessModes: [ "ReadWriteMany" ]
        resources:
          requests:
            storage: 1Gi
