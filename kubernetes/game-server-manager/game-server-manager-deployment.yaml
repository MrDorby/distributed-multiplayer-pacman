apiVersion: apps/v1
kind: Deployment
metadata:
  name: game-server-manager
  labels:
    app: pacman-game
spec:
  selector:
    matchLabels:
      app: pacman-game
      role: game-server-manager
  replicas: 1
  template:
    metadata:
      labels:
        app: pacman-game
        role: game-server-manager
    spec:
      serviceAccountName: game-server-manager-sa
      containers:
        - name: game-server-manager
          image: game-server-manager:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: MATCHMAKER_URI
              value: "http://matchmaker:8080"
            - name: GAMESERVER_IMAGE_NAME
              value: "pacman-game:latest"
            #- name: MIN_TIME_LEFT
            #  value: 8000
            - name: SHORT_TERM_DB_URI
              value: "mongodb://admin:password@shortdb-mongo-0.shortdb-mongo-svc.shortdb.svc.cluster.local:27017,shortdb-mongo-1.shortdb-mongo-svc.shortdb.svc.cluster.local:27017/shortDB?authSource=admin&replicaSet=shortdb-mongo"
            - name: LONG_TERM_DB_URI
              value: "mongodb://admin:password@longdb-mongo-0.longdb-mongo-svc.longdb.svc.cluster.local:27017,longdb-mongo-1.longdb-mongo-svc.longdb.svc.cluster.local:27017/statsDB?authSource=admin&replicaSet=longdb-mongo"
